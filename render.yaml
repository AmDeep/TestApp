services:
  - type: web
    name: harmonious-home
    runtime: node
    plan: free
    buildCommand: ONNXRUNTIME_NODE_INSTALL_CUDA=skip yarn install --production=false && yarn build
    startCommand: yarn start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: RAG_DISABLE_EMBEDDINGS
        value: "true"
